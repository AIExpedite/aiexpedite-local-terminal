name: release-nonprod

# Automatically build and release non-prod binaries on every push to main
on:
  push:
    branches:
      - main

# Cancel any in-flight nonprod release for the same ref when a newer push lands.
# Prevents racing tag-delete-and-recreate on `latest-internal` / `latest-dev` / `latest-stg` / `latest-beta`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: no write access. Only the publish jobs request `contents: write`.
permissions:
  contents: read

# Single source of truth for tool versions referenced from multiple steps.
# When bumping, update HERE only — both the `actions/cache` key and the
# `go install ...@VERSION` invocation pick up the new value automatically,
# preventing stale-cache bugs from forgetting one of the two places.
env:
  GO_WINRES_VERSION: v0.3.3
  # Force every JS action onto Node 24. Required because actions/setup-go@v6.4.0
  # (latest) still calls actions/cache@v4 internally for its module cache, and
  # v4 runs on Node 20 — which GitHub force-cuts to Node 24 on 2026-06-02 and
  # removes from runners on 2026-09-16. Flipping it now silences the deprecation
  # warning ahead of the cutover; remove once setup-go bumps its transitive cache.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

###############################################################################
# Build and release non-prod binaries (dev, stg, beta) - Windows only
# Triggered automatically on every push to main branch
###############################################################################
jobs:
  build-nonprod:
    name: Build ${{ matrix.env }}/windows/amd64
    # Per-env runner selection:
    #   dev/stg → windows-latest (GitHub-hosted, parallel on the GHA pool, ~$0.16/release)
    #   beta    → self-hosted (YubiKey signing requires the physical token)
    #
    # Why the split: dev/stg + beta all share one self-hosted runner = serialized
    # = 30+ min wall-clock for 3 builds, with the slow first cache-save dominating.
    # Moving the unsigned envs back to GHA-hosted lets all three run truly in
    # parallel; beta still needs the PIN, but doesn't block dev/stg anymore.
    #
    # SECURITY (self-hosted side): runner is registered at the *repository*
    # level (not the org level), so labels-only is sufficient — only workflows
    # in THIS repo can ever dispatch to it, regardless of label collisions in
    # other repos. If we ever need to share the runner across multiple org
    # repos, switch to an org-level runner inside a runner group restricted
    # to selected repos:
    #   runs_on: { group: yubikey-signing, labels: [self-hosted, Windows, X64, yubikey] }
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            display_name: "AI Expedite (Dev)"
            api_endpoint: "https://api.dev.aiexpedite.com/terminal"
            config_suffix: "-Dev"
            exe_suffix: "-dev"
            installer_iss: installer-dev.iss
            installer_name: AIExpediteTerminal-Dev-Setup.exe
            runs_on: windows-latest
          - env: stg
            display_name: "AI Expedite (Stg)"
            api_endpoint: "https://api.stg.aiexpedite.com/terminal"
            config_suffix: "-Stg"
            exe_suffix: "-stg"
            installer_iss: installer-stg.iss
            installer_name: AIExpediteTerminal-Stg-Setup.exe
            runs_on: windows-latest
          - env: beta
            display_name: "AI Expedite (Beta)"
            api_endpoint: "https://api.beta.aiexpedite.com/terminal"
            config_suffix: "-Beta"
            exe_suffix: "-beta"
            installer_iss: installer-beta.iss
            installer_name: AIExpediteTerminal-Beta-Setup.exe
            runs_on: [self-hosted, Windows, X64, yubikey]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The self-hosted runner has WSL's bash (C:\Windows\system32\bash.EXE)
      # ahead of Git Bash on PATH. WSL bash can't read GHA's temp script
      # paths (Windows backslashes get interpreted as escape sequences →
      # "no such file or directory"). Prepend Git Bash so `shell: bash`
      # resolves to it for every subsequent step in the job.
      - name: Ensure Git Bash on PATH
        shell: pwsh
        run: |
          $gitBash = "C:\Program Files\Git\bin"
          if (-not (Test-Path "$gitBash\bash.exe")) {
            throw "Git Bash not found at $gitBash. Install via: winget install Git.Git"
          }
          Add-Content $env:GITHUB_PATH $gitBash
          Write-Host "Prepended $gitBash to PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to 1.25 because go.mod requires 1.25+ — forced by
          # go.opentelemetry.io/otel/sdk v1.43.0, which carries the fix for
          # GHSA-hfvc-g4fc-pqhx / GHSA-9h8m-3fm2-qjrq (PATH hijacking).
          # Downgrading to 1.24 would reintroduce those high-severity CVEs.
          go-version: "1.25"

      - name: Download Go modules
        run: go mod download

      - name: Cache go-winres binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/go-winres.exe
          key: go-winres-${{ env.GO_WINRES_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install go-winres (pinned)
        shell: bash
        run: |
          if ! command -v go-winres >/dev/null 2>&1 && [ ! -f "$HOME/go/bin/go-winres.exe" ]; then
            go install "github.com/tc-hib/go-winres@${GO_WINRES_VERSION}"
          fi

      - name: Generate Windows resources (icon, manifest, version)
        shell: bash
        run: go-winres make --arch amd64

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist

          # Construct ldflags with environment-specific values
          # Using -H=windowsgui to build as GUI app (no console window by default)
          # Console is allocated on-demand when user clicks "Show Console" in tray menu
          LDFLAGS="-H=windowsgui -X main.EnvName=${{ matrix.env }}"
          LDFLAGS="$LDFLAGS -X 'main.EnvDisplayName=${{ matrix.display_name }}'"
          LDFLAGS="$LDFLAGS -X main.EnvAPIEndpoint=${{ matrix.api_endpoint }}"
          LDFLAGS="$LDFLAGS -X main.EnvConfigSuffix=${{ matrix.config_suffix }}"
          LDFLAGS="$LDFLAGS -X main.ReleaseChannel=${{ matrix.env }}"

          go build -ldflags "$LDFLAGS" -o "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe" .

      - name: Smoke test built binary
        shell: bash
        run: |
          OUTPUT=$(./dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "channel=${{ matrix.env }}" || { echo "channel mismatch"; exit 1; }
          echo "$OUTPUT" | grep -q "env=${{ matrix.env }}" || { echo "env mismatch"; exit 1; }
          echo "$OUTPUT" | grep -q "windows/amd64" || { echo "arch mismatch"; exit 1; }

      - name: Extract version from agent.go
        id: version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/.*(const|var) Version = "v([0-9]+\.[0-9]+\.[0-9]+)".*/\2/p' agent.go)
          [ -n "$VERSION" ] || { echo "version extraction from agent.go failed"; exit 1; }
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set installer version
        shell: bash
        run: |
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"$VERSION\"/" ${{ matrix.installer_iss }}
          sed -i "s/#define MyAppVersionString \".*\"/#define MyAppVersionString \"$VERSION\"/" ${{ matrix.installer_iss }}

      - name: Copy binary for installer
        shell: bash
        run: cp dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe aiexpedite-terminal${{ matrix.exe_suffix }}.exe

      # Sign the .exe BEFORE building the installer so the signed binary is
      # what gets embedded. PIN policy 'once' means this single signtool call
      # prompts for the YubiKey PIN one time and signs both files.
      # dev/stg are internal — skip signing to avoid PIN prompts on every push.
      - name: Sign Windows binary with YubiKey EV cert (beta only)
        if: matrix.env == 'beta'
        shell: pwsh
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ vars.WINDOWS_CERT_THUMBPRINT }}
        run: |
          ./scripts/sign/Sign-Binary.ps1 -Path `
            "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe", `
            "aiexpedite-terminal${{ matrix.exe_suffix }}.exe"

      - name: Verify Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw @"
          Inno Setup compiler not found at: $iscc
          The self-hosted runner is missing a required tool. Install via:
            winget install JRSoftware.InnoSetup
          (or download from https://jrsoftware.org/isinfo.php)
          See WINDOWS_CODE_SIGNING.md for the full runner setup checklist.
          "@
          }
          Write-Host "Found Inno Setup: $iscc"

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ${{ matrix.installer_iss }}

      - name: Copy installer to dist
        shell: bash
        run: cp installer-output/AIExpediteTerminal-*-Setup-*.exe dist/${{ matrix.installer_name }}

      - name: Sign Windows installer with YubiKey EV cert (beta only)
        if: matrix.env == 'beta'
        shell: pwsh
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ vars.WINDOWS_CERT_THUMBPRINT }}
        run: |
          ./scripts/sign/Sign-Binary.ps1 -Path "dist/${{ matrix.installer_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nonprod-${{ matrix.env }}-windows-amd64
          path: |
            dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe
            dist/${{ matrix.installer_name }}
          if-no-files-found: error
          # Consumed by the release job in this same run; the durable copy is the
          # GitHub Release asset. Short window instead of the ~7d default to keep
          # Actions storage down.
          retention-days: 2

  build-nonprod-darwin:
    name: Build ${{ matrix.env }}/darwin/${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, stg, beta]
        goarch: [amd64, arm64]
        include:
          - env: dev
            display_name: "AI Expedite (Dev)"
            api_endpoint: "https://api.dev.aiexpedite.com/terminal"
            config_suffix: "-Dev"
            exe_suffix: "-dev"
            silent_update_capable: "false"
          - env: stg
            display_name: "AI Expedite (Stg)"
            api_endpoint: "https://api.stg.aiexpedite.com/terminal"
            config_suffix: "-Stg"
            exe_suffix: "-stg"
            silent_update_capable: "false"
          - env: beta
            display_name: "AI Expedite (Beta)"
            api_endpoint: "https://api.beta.aiexpedite.com/terminal"
            config_suffix: "-Beta"
            exe_suffix: "-beta"
            silent_update_capable: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to 1.25 because go.mod requires 1.25+ — forced by
          # go.opentelemetry.io/otel/sdk v1.43.0, which carries the fix for
          # GHSA-hfvc-g4fc-pqhx / GHSA-9h8m-3fm2-qjrq (PATH hijacking).
          # Downgrading to 1.24 would reintroduce those high-severity CVEs.
          go-version: "1.25"

      - name: Download Go modules
        run: go mod download

      - name: Build binary
        run: |
          mkdir -p dist

          LDFLAGS="-X main.EnvName=${{ matrix.env }}"
          LDFLAGS="$LDFLAGS -X 'main.EnvDisplayName=${{ matrix.display_name }}'"
          LDFLAGS="$LDFLAGS -X main.EnvAPIEndpoint=${{ matrix.api_endpoint }}"
          LDFLAGS="$LDFLAGS -X main.EnvConfigSuffix=${{ matrix.config_suffix }}"
          LDFLAGS="$LDFLAGS -X main.ReleaseChannel=${{ matrix.env }}"
          LDFLAGS="$LDFLAGS -X main.silentUpdateCapableFlag=${{ matrix.silent_update_capable }}"

          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.goarch }} go build -ldflags "$LDFLAGS" -o "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-darwin-${{ matrix.goarch }}" .

      # macos-latest is arm64. arm64 binary runs natively (full --version
      # smoke test); amd64 binary is cross-compiled, so we validate its
      # Mach-O architecture instead of executing it. `file` confirms the
      # binary is the right arch + valid Mach-O — catches CGO link errors
      # or accidental wrong-arch builds without needing Rosetta.
      - name: Smoke test built binary (arm64 native)
        if: matrix.goarch == 'arm64'
        run: |
          OUTPUT=$(./dist/aiexpedite-terminal${{ matrix.exe_suffix }}-darwin-${{ matrix.goarch }} --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "channel=${{ matrix.env }}" || { echo "channel mismatch"; exit 1; }
          echo "$OUTPUT" | grep -q "env=${{ matrix.env }}" || { echo "env mismatch"; exit 1; }
          echo "$OUTPUT" | grep -q "darwin/arm64" || { echo "arch mismatch"; exit 1; }

      - name: Validate cross-compiled binary architecture (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          BIN="./dist/aiexpedite-terminal${{ matrix.exe_suffix }}-darwin-${{ matrix.goarch }}"
          INFO=$(file "$BIN")
          echo "$INFO"
          # macOS `file` reports e.g.: "Mach-O 64-bit executable x86_64"
          echo "$INFO" | grep -q "Mach-O 64-bit executable x86_64" || {
            echo "Cross-compile produced wrong arch — expected x86_64"
            exit 1
          }

      - name: Import Apple Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          security default-keychain -s $RUNNER_TEMP/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security import $RUNNER_TEMP/certificate.p12 \
            -k $RUNNER_TEMP/build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            $RUNNER_TEMP/build.keychain
          security list-keychains -d user -s $RUNNER_TEMP/build.keychain login.keychain
          rm $RUNNER_TEMP/certificate.p12
          security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain

      - name: Generate macOS icon
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     assets/aiexpedite-logo.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/aiexpedite-logo.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/aiexpedite-logo.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/aiexpedite-logo.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/aiexpedite-logo.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/aiexpedite-logo.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/aiexpedite-logo.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/aiexpedite-logo.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/aiexpedite-logo.png --out AppIcon.iconset/icon_512x512.png
          sips -z 681 681   assets/aiexpedite-logo.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Create .app bundle
        run: |
          VERSION=$(sed -nE 's/.*(const|var) Version = "v([0-9]+\.[0-9]+\.[0-9]+)".*/\2/p' agent.go)
          [ -n "$VERSION" ] || { echo "version extraction from agent.go failed"; exit 1; }

          APP="dmg-staging/AIExpediteTerminal.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-darwin-${{ matrix.goarch }}" "$APP/Contents/MacOS/AIExpediteTerminal"
          chmod +x "$APP/Contents/MacOS/AIExpediteTerminal"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>AI Expedite</string>
            <key>CFBundleDisplayName</key>
            <string>DISPLAY_NAME_PLACEHOLDER</string>
            <key>CFBundleIdentifier</key>
            <string>BUNDLE_ID_PLACEHOLDER</string>
            <key>CFBundleVersion</key>
            <string>VERSION_PLACEHOLDER</string>
            <key>CFBundleShortVersionString</key>
            <string>VERSION_PLACEHOLDER</string>
            <key>CFBundleExecutable</key>
            <string>AIExpediteTerminal</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Replace placeholders with actual values
          sed -i '' "s|DISPLAY_NAME_PLACEHOLDER|${{ matrix.display_name }}|g" "$APP/Contents/Info.plist"
          sed -i '' "s|BUNDLE_ID_PLACEHOLDER|com.aiexpedite.terminal${{ matrix.config_suffix }}|g" "$APP/Contents/Info.plist"
          sed -i '' "s|VERSION_PLACEHOLDER|${VERSION}|g" "$APP/Contents/Info.plist"

      - name: Code sign .app with Developer ID
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="dmg-staging/AIExpediteTerminal.app"

          codesign --force --options runtime --timestamp \
            --entitlements build/entitlements.mac.plist \
            --sign "$SIGNING_IDENTITY" \
            "$APP/Contents/MacOS/AIExpediteTerminal"

          codesign --force --options runtime --timestamp \
            --entitlements build/entitlements.mac.plist \
            --sign "$SIGNING_IDENTITY" \
            "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP"

      # Beta supports silent bundle replacement, so the app inside its DMG
      # must itself carry a notarization ticket. dev/stg deliberately use the
      # browser/manual-install fallback and remain signed but unnotarized.
      - name: Notarize and staple app bundle before packaging (beta)
        if: matrix.env == 'beta'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
        run: |
          APP="$PWD/dmg-staging/AIExpediteTerminal.app"
          ZIP="$RUNNER_TEMP/AIExpediteTerminal-${{ matrix.env }}-${{ matrix.goarch }}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --no-wait \
            --output-format json)
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "App notarization submitted as ${SUBMISSION_ID}; polling with heartbeats"
          ELAPSED=0
          while [ $ELAPSED -lt 7200 ]; do
            INFO_OUT=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APP_PASSWORD" 2>&1) || true
            STATUS=$(echo "$INFO_OUT" | awk -F': *' '/^[[:space:]]*status:/ {print $2; exit}')
            case "$STATUS" in
              Accepted) break ;;
              Invalid|Rejected)
                echo "App notarization $STATUS"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
                  --password "$APP_PASSWORD" || true
                exit 1
                ;;
              "In Progress"|"")
                if [ $((ELAPSED % 300)) -eq 0 ]; then
                  echo "App notarization still in progress (${ELAPSED}s elapsed)"
                fi
                sleep 60
                ELAPSED=$((ELAPSED + 60))
                ;;
              *) echo "Unexpected app notarization status: $STATUS"; exit 1 ;;
            esac
          done
          [ "$STATUS" = "Accepted" ] || { echo "App notarization timed out"; exit 1; }
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "$ZIP"

      - name: Cache pip wheels (dmgbuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: pip-dmgbuild-1.6.7-${{ runner.os }}-${{ runner.arch }}

      - name: Package as DMG
        id: package_dmg
        run: |
          pip3 install --break-system-packages 'dmgbuild==1.6.7'
          DMG_NAME="aiexpedite-terminal${{ matrix.exe_suffix }}-darwin-${{ matrix.goarch }}.dmg"
          echo "dmg_path=dist/${DMG_NAME}" >> $GITHUB_OUTPUT

          cat > /tmp/dmg-settings.py << 'PYEOF'
          import os
          application = defines.get("app_path")
          appname = os.path.basename(application)
          format = "UDZO"
          files = [application]
          # Do not add the conventional /Applications shortcut: this app must
          # be copied to the user's ~/Applications directory for silent updates.
          symlinks = {}
          icon = defines.get("volume_icon", None)
          icon_size = 100
          background = defines.get("background")
          icon_locations = {appname: (300, 190)}
          window_rect = ((200, 120), (600, 400))
          default_view = "icon-view"
          PYEOF

          python3 -m dmgbuild -s /tmp/dmg-settings.py \
            -D app_path="$PWD/dmg-staging/AIExpediteTerminal.app" \
            -D background="$PWD/assets/dmg-background.png" \
            -D volume_icon="$PWD/AppIcon.icns" \
            "AI Expedite (${{ matrix.env }})" \
            "dist/${DMG_NAME}"

      - name: Sign DMG with Developer ID
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "${{ steps.package_dmg.outputs.dmg_path }}"

      # dev/stg are internal-only — Developer ID signed but not notarized.
      # Internal testers can right-click → Open to bypass Gatekeeper.
      # Only beta is notarized (so external Beta testers don't see warnings).
      - name: Submit DMG for notarization (beta only, no wait)
        if: matrix.env == 'beta'
        id: notarize_submit
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
        run: |
          # Submit with --no-wait so this runner can release immediately.
          # The finalize-nonprod-beta-darwin job waits for Apple, staples, uploads.
          # Retry on transient submit failures — the build cost up to this point
          # is ~10 min and we don't want to throw it away over a network blip.
          notarize_submit_with_retry() {
            local dmg="$1"
            local attempt=1
            local max_attempts=3
            while [ $attempt -le $max_attempts ]; do
              if xcrun notarytool submit "${dmg}" \
                  --apple-id "$APPLE_ID" \
                  --team-id "$TEAM_ID" \
                  --password "$APP_PASSWORD" \
                  --no-wait \
                  --output-format json; then
                return 0
              fi
              echo "notarytool submit attempt ${attempt} failed" >&2
              if [ $attempt -lt $max_attempts ]; then
                sleep 60
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          if ! SUBMIT_OUTPUT=$(notarize_submit_with_retry "${{ steps.package_dmg.outputs.dmg_path }}"); then
            echo "notarytool submit failed after retries — aborting build"
            exit 1
          fi
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          mkdir -p notarize-pending
          cp "${{ steps.package_dmg.outputs.dmg_path }}" notarize-pending/
          echo "$SUBMISSION_ID" > notarize-pending/submission-id.txt

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true

      # dev/stg: signed DMG is the final artifact (no notarization).
      - name: Upload artifacts (dev/stg final)
        if: matrix.env != 'beta'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nonprod-${{ matrix.env }}-darwin-${{ matrix.goarch }}
          path: dist/aiexpedite-terminal${{ matrix.exe_suffix }}-darwin-${{ matrix.goarch }}.dmg
          if-no-files-found: error
          # Durable copy is the GitHub Release asset; short window vs ~7d default.
          retention-days: 2

      # beta: hand off DMG + submission_id to the finalize job.
      # Artifact name is intentionally NOT prefixed with "nonprod-" so the
      # release job's `pattern: nonprod-*` glob doesn't pick up the unstapled DMG.
      - name: Upload pending DMG for notarization wait (beta)
        if: matrix.env == 'beta'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-beta-darwin-${{ matrix.goarch }}
          path: notarize-pending/
          if-no-files-found: error
          retention-days: 1

  ###############################################################################
  # Wait for Apple notarization, staple the ticket, and upload the final DMGs.
  #
  # MATRIX-PER-ARCH (not single job): each arch gets its own runner so a
  # GitHub-hosted macOS runner reclaim only loses one arch's work, not both.
  # Learned the hard way in run #150 — the prior single-job design completed
  # both arches' staple+validate then was killed by the runner 0.04s before
  # the upload step ran, losing both DMGs. Matrix is slightly more expensive
  # in macOS-min ($2-4 per release) but each upload is independent, so
  # partial-success is recoverable. fail-fast: false ensures one arch's
  # failure doesn't cancel the other.
  ###############################################################################
  finalize-nonprod-beta-darwin:
    name: Finalize beta/darwin/${{ matrix.goarch }} (notarize wait + staple)
    needs: build-nonprod-darwin
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Download pending beta DMG and submission ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pending-beta-darwin-${{ matrix.goarch }}
          path: pending/

      - name: Poll Apple for notarization completion + staple
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
          ARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist

          # NO `trap '... EXIT'` here. A previous version had
          #   trap 'kill 0 2>/dev/null || true' EXIT
          # which sends SIGTERM to the entire process group — including the
          # script's own bash process. Bash queues the SIGTERM during the
          # trap, then exits 143 (128 + signal 15) instead of 0. Made
          # every run look like a runner reclaim. The polling design has
          # no backgrounded subprocesses to clean up, so no trap is needed.

          SUB_ID=$(cat "pending/submission-id.txt")
          DMG=$(ls pending/*.dmg | head -1)

          # Why polling instead of `notarytool wait --timeout 120m`:
          # macOS GHA runners reliably die ~17–19 minutes into a long
          # blocking notarytool wait subprocess (observed in runs #150,
          # #152, #153 amd64), losing all in-flight work. Polling
          # `notarytool info` every 60s replaces one 17-minute network
          # call with many 1-second calls. The script spends most of its
          # time in `sleep`, which keeps the runner agent's keepalive
          # happy. If a SIGTERM still lands during a sleep, we lose at
          # most ~60 seconds of work, not 17 minutes.
          echo "[${ARCH}] Polling Apple for notarization (submission ${SUB_ID})"

          MAX_MINUTES=120
          POLL_SECONDS=60
          HEARTBEAT_SECONDS=300       # log a heartbeat at least this often
          ELAPSED=0
          LAST_HEARTBEAT=0

          while [ $ELAPSED -lt $((MAX_MINUTES * 60)) ]; do
            INFO_OUT=$(xcrun notarytool info "${SUB_ID}" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APP_PASSWORD" 2>&1) || true

            # Extract status. notarytool's output is YAML-ish:
            #   status: Accepted | In Progress | Invalid
            STATUS=$(echo "$INFO_OUT" | awk -F': *' '/^[[:space:]]*status:/ {print $2; exit}')

            case "$STATUS" in
              Accepted)
                echo "[${ARCH}] notarization Accepted after ~$((ELAPSED / 60))m"
                break
                ;;
              Invalid|Rejected)
                echo "[${ARCH}] notarization $STATUS — fetching developer log"
                xcrun notarytool log "${SUB_ID}" \
                  --apple-id "$APPLE_ID" \
                  --team-id "$TEAM_ID" \
                  --password "$APP_PASSWORD" || true
                exit 1
                ;;
              "In Progress"|"")
                # Heartbeat tracked by elapsed-time delta, not by modulo —
                # so any POLL_SECONDS value (not just divisors of HEARTBEAT)
                # still produces regular heartbeats.
                if [ $((ELAPSED - LAST_HEARTBEAT)) -ge $HEARTBEAT_SECONDS ] && [ $ELAPSED -gt 0 ]; then
                  echo "[${ARCH}] heartbeat: still in progress (~$((ELAPSED / 60))m elapsed)"
                  LAST_HEARTBEAT=$ELAPSED
                fi
                sleep "$POLL_SECONDS"
                ELAPSED=$((ELAPSED + POLL_SECONDS))
                ;;
              *)
                # Unknown status — log full output, treat as transient.
                echo "[${ARCH}] unexpected notarytool status: ${STATUS}"
                echo "$INFO_OUT"
                sleep "$POLL_SECONDS"
                ELAPSED=$((ELAPSED + POLL_SECONDS))
                ;;
            esac
          done

          if [ $ELAPSED -ge $((MAX_MINUTES * 60)) ]; then
            echo "[${ARCH}] timeout after ${MAX_MINUTES} minutes — Apple may be backed up"
            exit 1
          fi

          echo "[${ARCH}] Stapling ${DMG}"
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

          cp "${DMG}" "dist/$(basename "${DMG}")"

      - name: Upload final beta darwin DMG
        # Run even if a flaky earlier step failed — if we have the staple
        # produced, ship it. if-no-files-found below catches the case where
        # the previous step failed before producing the DMG.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nonprod-beta-darwin-${{ matrix.goarch }}
          path: dist/aiexpedite-terminal-beta-darwin-${{ matrix.goarch }}.dmg
          if-no-files-found: error
          # Durable copy is the GitHub Release asset; short window vs ~7d default.
          retention-days: 2

  build-nonprod-linux:
    name: Build ${{ matrix.env }}/linux/amd64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            display_name: "AI Expedite (Dev)"
            api_endpoint: "https://api.dev.aiexpedite.com/terminal"
            config_suffix: "-Dev"
            exe_suffix: "-dev"
          - env: stg
            display_name: "AI Expedite (Stg)"
            api_endpoint: "https://api.stg.aiexpedite.com/terminal"
            config_suffix: "-Stg"
            exe_suffix: "-stg"
          - env: beta
            display_name: "AI Expedite (Beta)"
            api_endpoint: "https://api.beta.aiexpedite.com/terminal"
            config_suffix: "-Beta"
            exe_suffix: "-beta"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to 1.25 because go.mod requires 1.25+ — forced by
          # go.opentelemetry.io/otel/sdk v1.43.0, which carries the fix for
          # GHSA-hfvc-g4fc-pqhx / GHSA-9h8m-3fm2-qjrq (PATH hijacking).
          # Downgrading to 1.24 would reintroduce those high-severity CVEs.
          go-version: "1.25"

      - name: Download Go modules
        run: go mod download

      - name: Install systray and AppImage dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: gcc pkg-config libayatana-appindicator3-dev libfuse2
          version: 1.0

      - name: Build binary
        run: |
          mkdir -p dist

          LDFLAGS="-X main.EnvName=${{ matrix.env }}"
          LDFLAGS="$LDFLAGS -X 'main.EnvDisplayName=${{ matrix.display_name }}'"
          LDFLAGS="$LDFLAGS -X main.EnvAPIEndpoint=${{ matrix.api_endpoint }}"
          LDFLAGS="$LDFLAGS -X main.EnvConfigSuffix=${{ matrix.config_suffix }}"
          LDFLAGS="$LDFLAGS -X main.ReleaseChannel=${{ matrix.env }}"

          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-linux-amd64" .

      - name: Smoke test built binary
        run: |
          # Confirms the binary loads, ldflags-injected vars are wired,
          # and the env channel matches what we asked for. Catches regressions
          # before they ship.
          OUTPUT=$(./dist/aiexpedite-terminal${{ matrix.exe_suffix }}-linux-amd64 --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "channel=${{ matrix.env }}" || { echo "channel mismatch"; exit 1; }
          echo "$OUTPUT" | grep -q "env=${{ matrix.env }}" || { echo "env mismatch"; exit 1; }

      - name: Package as AppImage
        run: |
          # Pinned to appimagetool 1.9.1 (from new official AppImage/appimagetool repo)
          # with SHA-256 verification — defends against rolling-`continuous` tag tampering.
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          wget -q "$APPIMAGETOOL_URL" -O appimagetool
          echo "${APPIMAGETOOL_SHA}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-linux-amd64" AppDir/usr/bin/AIExpediteTerminal
          chmod +x AppDir/usr/bin/AIExpediteTerminal

          cat > AppDir/AIExpediteTerminal.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=AI Expedite (${{ matrix.env }})
          Exec=AIExpediteTerminal
          Icon=aiexpedite-terminal
          Type=Application
          Categories=Development;
          DESKTOP

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "${HERE}/usr/bin/AIExpediteTerminal" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          if [ ! -f icon.png ]; then
            touch AppDir/usr/share/icons/hicolor/256x256/apps/aiexpedite-terminal.png
          else
            cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/aiexpedite-terminal.png
          fi
          ln -sf usr/share/icons/hicolor/256x256/apps/aiexpedite-terminal.png AppDir/aiexpedite-terminal.png

          ARCH=x86_64 ./appimagetool --no-appstream AppDir "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-linux-amd64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nonprod-${{ matrix.env }}-linux-amd64
          path: dist/aiexpedite-terminal${{ matrix.exe_suffix }}-linux-amd64.AppImage
          if-no-files-found: error
          # Durable copy is the GitHub Release asset; short window vs ~7d default.
          retention-days: 2

  ###############################################################################
  # Create non-prod release (pre-release, hidden from main downloads)
  ###############################################################################
  release-nonprod:
    name: Publish non-prod release
    needs: [build-nonprod, build-nonprod-darwin, finalize-nonprod-beta-darwin, build-nonprod-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # required for sigstore signing in attest
      attestations: write   # required to upload the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download non-prod binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nonprod-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      # SLSA build provenance — proves these binaries were produced by THIS
      # workflow run, on a GitHub-hosted (or known self-hosted) runner, from
      # the commit referenced in github.sha. Stored as a sigstore-signed
      # attestation alongside the release. Verifiable by anyone with `gh attestation verify`.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/aiexpedite-terminal-*-windows-amd64.exe
            dist/AIExpediteTerminal-*-Setup.exe
            dist/aiexpedite-terminal-*-darwin-amd64.dmg
            dist/aiexpedite-terminal-*-darwin-arm64.dmg
            dist/aiexpedite-terminal-*-linux-amd64.AppImage

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Delete existing internal release and recreate tag
        run: |
          # Delete existing release (if any)
          gh release delete latest-internal --yes || true
          # Delete existing tag from remote (if any)
          git push origin :refs/tags/latest-internal || true
          # Delete local tag (if any)
          git tag -d latest-internal || true
          # Create new tag pointing to current commit
          git tag latest-internal
          # Push the new tag
          git push origin latest-internal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish non-prod pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-internal
          name: "Internal Builds (${{ steps.sha.outputs.short_sha }})"
          draft: false
          prerelease: true
          files: dist/**
          body: |
            ## Internal Builds (Dev, Staging, Beta)

            **Note:** These builds are for internal testing only.

            **Commit:** ${{ github.sha }}

            | Environment | Windows Installer | Windows Standalone | macOS (Apple Silicon) | macOS (Intel) | Linux |
            |-------------|------------------|-------------------|----------------------|---------------|-------|
            | Development | `AIExpediteTerminal-Dev-Setup.exe` | `aiexpedite-terminal-dev-windows-amd64.exe` | `aiexpedite-terminal-dev-darwin-arm64.dmg` | `aiexpedite-terminal-dev-darwin-amd64.dmg` | `aiexpedite-terminal-dev-linux-amd64.AppImage` |
            | Staging | `AIExpediteTerminal-Stg-Setup.exe` | `aiexpedite-terminal-stg-windows-amd64.exe` | `aiexpedite-terminal-stg-darwin-arm64.dmg` | `aiexpedite-terminal-stg-darwin-amd64.dmg` | `aiexpedite-terminal-stg-linux-amd64.AppImage` |
            | Beta | `AIExpediteTerminal-Beta-Setup.exe` | `aiexpedite-terminal-beta-windows-amd64.exe` | `aiexpedite-terminal-beta-darwin-arm64.dmg` | `aiexpedite-terminal-beta-darwin-amd64.dmg` | `aiexpedite-terminal-beta-linux-amd64.AppImage` |

            All environments can run side-by-side on the same machine.

  ###############################################################################
  # Create environment-specific releases (non-prerelease for auto-update checking)
  #
  # NOTE on `needs:`. This depends on the WHOLE build-nonprod matrix (all
  # envs) succeeding, even though each channel only consumes its own artifacts.
  # If a build fails, channel releases are blocked.
  # GHA doesn't natively support per-matrix-entry `needs:` — the current
  # behavior is acceptable: failed runs are uncommon and the operator can
  # re-run only the failed matrix entry from the GH UI.
  ###############################################################################
  release-channel:
    name: Publish ${{ matrix.channel }} release for auto-update
    needs: [build-nonprod, build-nonprod-darwin, finalize-nonprod-beta-darwin, build-nonprod-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: dev
            name: "Development"
            title: "Dev Build"
            exe: "aiexpedite-terminal-dev-windows-amd64.exe"
            installer: "AIExpediteTerminal-Dev-Setup.exe"
            dmg_intel: "aiexpedite-terminal-dev-darwin-amd64.dmg"
            dmg_arm: "aiexpedite-terminal-dev-darwin-arm64.dmg"
            appimage: "aiexpedite-terminal-dev-linux-amd64.AppImage"
          - channel: stg
            name: "Staging"
            title: "Staging Build"
            exe: "aiexpedite-terminal-stg-windows-amd64.exe"
            installer: "AIExpediteTerminal-Stg-Setup.exe"
            dmg_intel: "aiexpedite-terminal-stg-darwin-amd64.dmg"
            dmg_arm: "aiexpedite-terminal-stg-darwin-arm64.dmg"
            appimage: "aiexpedite-terminal-stg-linux-amd64.AppImage"
          - channel: beta
            name: "Beta"
            title: "Beta Build"
            exe: "aiexpedite-terminal-beta-windows-amd64.exe"
            installer: "AIExpediteTerminal-Beta-Setup.exe"
            dmg_intel: "aiexpedite-terminal-beta-darwin-amd64.dmg"
            dmg_arm: "aiexpedite-terminal-beta-darwin-arm64.dmg"
            appimage: "aiexpedite-terminal-beta-linux-amd64.AppImage"
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ${{ matrix.channel }} binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nonprod-${{ matrix.channel }}-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Generate build provenance attestation (${{ matrix.channel }} artifacts)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ matrix.exe }}
            dist/${{ matrix.installer }}
            dist/${{ matrix.dmg_intel }}
            dist/${{ matrix.dmg_arm }}
            dist/${{ matrix.appimage }}

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Extract version from agent.go
        id: version
        run: |
          VERSION=$(grep -oP '(const|var) Version = "v\K[0-9]+\.[0-9]+\.[0-9]+' agent.go)
          [ -n "$VERSION" ] || { echo "version extraction from agent.go failed"; exit 1; }
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Delete existing ${{ matrix.channel }} release and recreate tag
        run: |
          gh release delete latest-${{ matrix.channel }} --yes || true
          git push origin :refs/tags/latest-${{ matrix.channel }} || true
          git tag -d latest-${{ matrix.channel }} || true
          git tag latest-${{ matrix.channel }}
          git push origin latest-${{ matrix.channel }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.channel }} release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-${{ matrix.channel }}
          name: "${{ matrix.title }} ${{ steps.version.outputs.version }} (${{ steps.sha.outputs.short_sha }})"
          draft: false
          prerelease: false
          files: dist/**
          body: |
            ## ${{ matrix.name }} Build

            Auto-update target for ${{ matrix.channel }} environment.

            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            | Platform | Download |
            |----------|----------|
            | Windows | `${{ matrix.exe }}` |
            | macOS (Apple Silicon) | `${{ matrix.dmg_arm }}` |
            | macOS (Intel) | `${{ matrix.dmg_intel }}` |
            | Linux | `${{ matrix.appimage }}` |
