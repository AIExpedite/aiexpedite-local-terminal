name: release-nonprod

# Automatically build and release non-prod binaries on every push to main
on:
  push:
    branches:
      - main

permissions:
  contents: write

###############################################################################
# Build and release non-prod binaries (dev, stg, beta) - Windows only
# Triggered automatically on every push to main branch
###############################################################################
jobs:
  build-nonprod:
    name: Build ${{ matrix.env }}/windows/amd64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            display_name: "AI Expedite Terminal (Dev)"
            api_endpoint: "https://api.dev.aiexpedite.com/terminal"
            config_suffix: "-Dev"
            exe_suffix: "-dev"
          - env: stg
            display_name: "AI Expedite Terminal (Stg)"
            api_endpoint: "https://api.stg.aiexpedite.com/terminal"
            config_suffix: "-Stg"
            exe_suffix: "-stg"
          - env: beta
            display_name: "AI Expedite Terminal (Beta)"
            api_endpoint: "https://api.beta.aiexpedite.com/terminal"
            config_suffix: "-Beta"
            exe_suffix: "-beta"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download Go modules
        run: go mod tidy

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist

          # Construct ldflags with environment-specific values
          # Using -H=windowsgui to build as GUI app (no console window by default)
          # Console is allocated on-demand when user clicks "Show Console" in tray menu
          LDFLAGS="-H=windowsgui -X main.EnvName=${{ matrix.env }}"
          LDFLAGS="$LDFLAGS -X 'main.EnvDisplayName=${{ matrix.display_name }}'"
          LDFLAGS="$LDFLAGS -X main.EnvAPIEndpoint=${{ matrix.api_endpoint }}"
          LDFLAGS="$LDFLAGS -X main.EnvConfigSuffix=${{ matrix.config_suffix }}"

          go build -ldflags "$LDFLAGS" -o "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonprod-${{ matrix.env }}-windows-amd64
          path: dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe

  ###############################################################################
  # Create non-prod release (pre-release, hidden from main downloads)
  ###############################################################################
  release-nonprod:
    name: Publish non-prod release
    needs: build-nonprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download non-prod binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nonprod-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Delete existing internal release and recreate tag
        run: |
          # Delete existing release (if any)
          gh release delete latest-internal --yes || true
          # Delete existing tag from remote (if any)
          git push origin :refs/tags/latest-internal || true
          # Delete local tag (if any)
          git tag -d latest-internal || true
          # Create new tag pointing to current commit
          git tag latest-internal
          # Push the new tag
          git push origin latest-internal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish non-prod pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-internal
          name: "Internal Builds (${{ steps.sha.outputs.short_sha }})"
          draft: false
          prerelease: true
          files: dist/**
          body: |
            ## Internal Builds (Dev, Staging, Beta)

            **Note:** These builds are for internal testing only (Windows).

            **Commit:** ${{ github.sha }}

            | Environment | Download |
            |-------------|----------|
            | Development | `aiexpedite-terminal-dev-windows-amd64.exe` |
            | Staging | `aiexpedite-terminal-stg-windows-amd64.exe` |
            | Beta | `aiexpedite-terminal-beta-windows-amd64.exe` |

            All environments can run side-by-side on the same machine.
