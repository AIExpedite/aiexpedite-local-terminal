name: build-and-release

on:
  push:
    tags:
      - "v*" # fires only for version tags

permissions:
  contents: write # needed for uploading release assets
  packages: write # for GHCR push (docker job)

###########################################################################
# 1️⃣  MULTI‑PLATFORM GO BUILD & PUBLISH
###########################################################################
jobs:
  build-binaries:
    name: Build ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per OS → we can compile natively without cgo cross issues
        include:
          - os: ubuntu-latest # produces linux/amd64
            goos: linux
            goarch: amd64
            ldflags: ""
            ext: ""
          - os: windows-latest # produces windows/amd64 with GUI subsystem
            goos: windows
            goarch: amd64
            ldflags: "-H=windowsgui"
            ext: ".exe"
          - os: macos-latest # produces darwin/amd64
            goos: darwin
            goarch: amd64
            ldflags: ""
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Tidy (fetch deps)
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/aiexpedite-local-terminal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "${{ matrix.ldflags }}" -o "$out" .
          echo "BUILT=$out" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: ${{ env.BUILT }}

  ###########################################################################
  # 2️⃣  CREATE / UPDATE THE GITHUB RELEASE WITH BINARIES
  ###########################################################################
  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**

  ###########################################################################
  # 3️⃣  (OPTIONAL) BUILD + PUSH YOUR ttyp-helper CONTAINER
  ###########################################################################
  docker:
    needs: release # run after binaries succeed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push helper image
        run: |
          docker buildx build --push \
            -t ghcr.io/${{ github.repository }}/ttyd-helper:latest .
