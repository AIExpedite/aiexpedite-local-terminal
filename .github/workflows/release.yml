name: build-and-release

on:
  push:
    tags:
      - "v*" # run only for version tags

permissions:
  contents: write # upload assets to the release
  packages: write # push helper image to GHCR

###############################################################################
# 1. Build production binaries (public release)
# Note: Currently only Windows is supported as main.go has Windows-specific code
###############################################################################
jobs:
  build-prod:
    name: Build prod/windows/amd64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download Go modules
        run: go mod tidy

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist

          # Production environment ldflags
          # Note: NOT using -H=windowsgui so the console window is visible
          # This allows users to see startup messages and debug info
          LDFLAGS="-X main.EnvName=prod"
          LDFLAGS="$LDFLAGS -X 'main.EnvDisplayName=AI Expedite Terminal'"
          LDFLAGS="$LDFLAGS -X main.EnvAPIEndpoint=https://api.aiexpedite.com/terminal"
          LDFLAGS="$LDFLAGS -X main.EnvConfigSuffix="

          go build -ldflags "$LDFLAGS" -o "dist/aiexpedite-terminal-windows-amd64.exe" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-windows-amd64
          path: dist/aiexpedite-terminal-windows-amd64.exe

  ###############################################################################
  # 2. Build non-prod binaries (dev, stg, beta) - Windows only, hidden pre-release
  ###############################################################################
  build-nonprod:
    name: Build ${{ matrix.env }}/windows/amd64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            display_name: "AI Expedite Terminal (Dev)"
            api_endpoint: "https://api.dev.aiexpedite.com/terminal"
            config_suffix: "-Dev"
            exe_suffix: "-dev"
          - env: stg
            display_name: "AI Expedite Terminal (Stg)"
            api_endpoint: "https://api.stg.aiexpedite.com/terminal"
            config_suffix: "-Stg"
            exe_suffix: "-stg"
          - env: beta
            display_name: "AI Expedite Terminal (Beta)"
            api_endpoint: "https://api.beta.aiexpedite.com/terminal"
            config_suffix: "-Beta"
            exe_suffix: "-beta"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download Go modules
        run: go mod tidy

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist

          # Construct ldflags with environment-specific values
          # Note: NOT using -H=windowsgui so the console window is visible
          # This allows users to see startup messages and debug info
          LDFLAGS="-X main.EnvName=${{ matrix.env }}"
          LDFLAGS="$LDFLAGS -X 'main.EnvDisplayName=${{ matrix.display_name }}'"
          LDFLAGS="$LDFLAGS -X main.EnvAPIEndpoint=${{ matrix.api_endpoint }}"
          LDFLAGS="$LDFLAGS -X main.EnvConfigSuffix=${{ matrix.config_suffix }}"

          go build -ldflags "$LDFLAGS" -o "dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonprod-${{ matrix.env }}-windows-amd64
          path: dist/aiexpedite-terminal${{ matrix.exe_suffix }}-windows-amd64.exe

  ###############################################################################
  # 3. Create production release (public, shown to users)
  ###############################################################################
  release-prod:
    name: Publish production release
    needs: build-prod
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download prod binaries
        uses: actions/download-artifact@v4
        with:
          pattern: prod-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish production release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**
          body: |
            ## AI Expedite Terminal

            Download for Windows: `aiexpedite-terminal-windows-amd64.exe`

            ### Installation
            1. Download and run the executable
            2. If Windows SmartScreen appears, click "More info" then "Run anyway"
            3. Click "Register Device" in the system tray to connect to your AI Expedite account

  ###############################################################################
  # 4. Create non-prod release (pre-release, hidden from main downloads)
  ###############################################################################
  release-nonprod:
    name: Publish non-prod release
    needs: build-nonprod
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download non-prod binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nonprod-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Delete existing internal release
        run: |
          gh release delete latest-internal --yes || true
          git push origin :refs/tags/latest-internal || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish non-prod pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-internal
          name: "Internal Builds (${{ steps.version.outputs.version }})"
          prerelease: true
          files: dist/**
          body: |
            ## Internal Builds (Dev, Staging, Beta)

            **Note:** These builds are for internal testing only (Windows).

            | Environment | Download |
            |-------------|----------|
            | Development | `aiexpedite-terminal-dev-windows-amd64.exe` |
            | Staging | `aiexpedite-terminal-stg-windows-amd64.exe` |
            | Beta | `aiexpedite-terminal-beta-windows-amd64.exe` |

            All environments can run side-by-side on the same machine.

  ###############################################################################
  # 5. (optional) build & push your ttyd-helper container
  ###############################################################################
  docker:
    name: Push helper image to GHCR
    needs: release-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          # Repository name must be lowercase for Docker tags
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --push \
            -t ghcr.io/${REPO_LOWER}/ttyd-helper:latest .
