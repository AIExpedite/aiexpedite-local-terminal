name: build-and-release

on:
  push:
    tags:
      - "v*" # trigger only for version tags like v0.2.0

permissions:
  contents: write # upload release assets
  packages: write # push helper image to GHCR

###############################################################################
# 1️⃣  Build native binaries on three OS‑matrix runners
###############################################################################
jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ldflags: ""
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ldflags: "-H=windowsgui"
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ldflags: ""
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download Go modules
        run: go mod tidy

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          OUT=dist/aiexpedite-local-terminal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          go build -ldflags "${{ matrix.ldflags }}" -o "${OUT}" .
          echo "OUT_PATH=${OUT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: ${{ env.OUT_PATH }}

  ###############################################################################
  # 2️⃣  Create / update the GitHub Release and attach assets
  ###############################################################################
  release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Generate SHA‑256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**

  ###############################################################################
  # 3️⃣  (Optional) build & push your ttyd‑helper container
  ###############################################################################
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push helper image
        run: |
          docker buildx build --push \
            -t ghcr.io/${{ github.repository }}/ttyd-helper:latest .
