name: build-and-release

on:
  push:
    tags:
      - "v*" # run only for version tags

permissions:
  contents: write # upload assets to the release
  packages: write # push helper image to GHCR

###############################################################################
# 1️⃣  Build native binaries on three matrix runners
###############################################################################
jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # linux/amd64
            goos: linux
            goarch: amd64
            ldflags: ""
            ext: ""
          - os: windows-latest # windows/amd64 (GUI subsystem)
            goos: windows
            goarch: amd64
            ldflags: "-H=windowsgui"
            ext: ".exe"
          - os: macos-latest # darwin/amd64
            goos: darwin
            goarch: amd64
            ldflags: ""
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download Go modules
        run: go mod tidy # populates go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BIN="dist/aiexpedite-local-terminal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "${{ matrix.ldflags }}" -o "$BIN" .
          echo "BIN=$BIN" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN }}

  ###############################################################################
  # 2️⃣  Create / update the GitHub Release and attach assets
  ###############################################################################
  release:
    name: Publish GitHub release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-* # grab every OS/arch artifact
          path: dist
          merge-multiple: true

      - name: Generate SHA‑256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**

  ###############################################################################
  # 3️⃣  (optional) build & push your ttyd‑helper container
  ###############################################################################
  docker:
    name: Push helper image to GHCR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker buildx build --push \
            -t ghcr.io/${{ github.repository }}/ttyd-helper:latest .
